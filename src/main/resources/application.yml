spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fiapx_notifications}
    username: ${DB_USER:fiapx}
    password: ${DB_PASSWORD:change-me}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:fiapx}
    password: ${RABBIT_PASSWORD:change-me}
    publisher-confirm-type: correlated
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
storage:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:fiapx}
  secret-key: ${S3_SECRET_KEY:change-me}
  bucket: ${S3_BUCKET:videos}
notifications:
  from: ${MAIL_FROM:fiapx@localhost}
